name: Nazar Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Code Formatting
        run: pnpm format:check

      - name: Static Code Analysis (Lint)
        run: pnpm lint

      - name: Static Type Checking
        run: pnpm typecheck

      - name: Start Database & Cache Containers
        run: |
          docker compose up -d --wait postgres redis
          docker compose ps

      - name: Run Database Migrations & Seeds
        run: |
          pnpm --filter @platform/api db:migrate
          pnpm --filter @platform/api db:seed
        env:
          DATABASE_URL: postgresql://nazar_user:nazar_password@localhost:5432/nazar_db

      - name: Run Test Suite
        run: pnpm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://nazar_user:nazar_password@localhost:5432/nazar_db
          REDIS_URL: redis://:nazar_redis_password@localhost:6379/0

      - name: Build Monorepo Packages & Applications
        run: pnpm build

      - name: Container Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
